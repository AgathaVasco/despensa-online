<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Despensa Online</title>
<meta name="theme-color" content="#15803d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Despensa">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --verde:#15803d; --verde-2:#16a34a; --verde-claro:#dcfce7; --verde-borda:#bbf7d0;
  --laranja:#ea580c; --laranja-claro:#ffedd5; --vermelho:#dc2626; --vermelho-claro:#fee2e2;
  --azul:#2563eb; --azul-claro:#dbeafe; --amarelo:#ca8a04; --amarelo-claro:#fef9c3;
  --fundo:#f6f7f4; --card:#ffffff; --texto:#1c1917; --suave:#78716c; --linha:#e7e5e4;
  --raio:14px; --sombra:0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fundo);color:var(--texto);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2}
.oculto{display:none!important}

/* ---------- topo e navegação ---------- */
header.topo{position:sticky;top:0;z-index:20;background:var(--verde);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:10px}
header.topo h1{font-size:18px;flex:1}
header.topo small{opacity:.85;font-size:12px;display:block;font-weight:400}
.topo .btn-ico{background:rgba(255,255,255,.15);border:0;color:#fff;width:36px;height:36px;border-radius:10px;font-size:18px}
main{padding:14px 14px calc(90px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
nav.abas{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--linha);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.abas button{flex:1;border:0;background:none;padding:8px 0 9px;font-size:11px;color:var(--suave);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.abas button span{font-size:22px;line-height:1;filter:grayscale(1);opacity:.7}
nav.abas button.ativa{color:var(--verde);font-weight:600}
nav.abas button.ativa span{filter:none;opacity:1}

/* ---------- componentes ---------- */
.card{background:var(--card);border-radius:var(--raio);box-shadow:var(--sombra);padding:14px;margin-bottom:12px}
.titulo-secao{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 8px}
.titulo-secao h2{font-size:16px}
.titulo-secao a,.link{color:var(--verde);font-weight:600;font-size:13px;text-decoration:none;background:none;border:0;padding:0}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--verde);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55}
.btn.sec{background:var(--verde-claro);color:var(--verde)}
.btn.cinza{background:#f1f0ee;color:var(--texto)}
.btn.perigo{background:var(--vermelho-claro);color:var(--vermelho)}
.btn.bloco{width:100%}
.btn.peq{padding:7px 11px;font-size:13px;border-radius:10px}
.linha-btns{display:flex;gap:8px;flex-wrap:wrap}
.linha-btns .btn{flex:1}
label.campo{display:block;margin-bottom:10px}
label.campo>span{display:block;font-size:12px;font-weight:600;color:var(--suave);margin-bottom:4px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],select,textarea{width:100%;border:1px solid var(--linha);border-radius:10px;padding:11px 12px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--verde-2);box-shadow:0 0 0 3px var(--verde-claro)}
textarea{min-height:90px;resize:vertical}
.grade2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grade3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600;background:#f1f0ee;color:var(--suave);white-space:nowrap}
.chip.verde{background:var(--verde-claro);color:var(--verde)}
.chip.laranja{background:var(--laranja-claro);color:var(--laranja)}
.chip.vermelho{background:var(--vermelho-claro);color:var(--vermelho)}
.chip.azul{background:var(--azul-claro);color:var(--azul)}
.chip.amarelo{background:var(--amarelo-claro);color:var(--amarelo)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.seletor{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.seletor button{border:1px solid var(--linha);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;white-space:nowrap}
.seletor button.ativo{background:var(--verde);border-color:var(--verde);color:#fff;font-weight:600}
.toggle{border:1px solid var(--linha);background:#fff;border-radius:10px;padding:8px 11px;font-size:13px}
.toggle.on{background:var(--verde-claro);border-color:var(--verde-borda);color:var(--verde);font-weight:600}
.vazio{text-align:center;color:var(--suave);padding:26px 12px}
.vazio .grande{font-size:40px;display:block;margin-bottom:6px}
.aviso{background:var(--amarelo-claro);color:#713f12;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.muted{color:var(--suave);font-size:13px}

/* ---------- início ---------- */
.ola{margin:4px 2px 14px}
.ola h2{font-size:20px}
.resumo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.resumo .card{margin:0;padding:12px 10px;text-align:center}
.resumo b{display:block;font-size:22px}
.resumo small{color:var(--suave);font-size:11px}
.hoje-ref{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--linha)}
.hoje-ref:first-of-type{border-top:0}
.hoje-ref .tipo{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--suave);width:62px}

/* ---------- despensa ---------- */
.busca{position:relative;margin-bottom:10px}
.busca input{padding-left:36px}
.busca::before{content:"🔍";position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:14px}
.grupo h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--suave);margin:16px 4px 6px}
.item{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:10px 10px 10px 12px;margin-bottom:6px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.item .info{flex:1;min-width:0}
.item .nome{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .det{font-size:12px;color:var(--suave);display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.qtd{display:flex;align-items:center;gap:4px}
.qtd button{width:30px;height:30px;border-radius:9px;border:1px solid var(--linha);background:#fff;font-size:17px;line-height:1}
.qtd b{min-width:52px;text-align:center;font-size:13px}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:21;width:56px;height:56px;border-radius:18px;border:0;background:var(--verde);color:#fff;font-size:28px;box-shadow:0 6px 18px rgba(21,128,61,.4)}

/* ---------- cardápio ---------- */
.dia h3{font-size:14px;margin:18px 4px 8px;color:var(--verde)}
.refeicao{background:#fff;border-radius:var(--raio);box-shadow:var(--sombra);padding:12px 14px;margin-bottom:8px;display:block;width:100%;text-align:left;border:0}
.refeicao .tipo{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--suave);letter-spacing:.04em}
.refeicao .nome{font-weight:700;font-size:15px;margin:2px 0}
.refeicao .desc{font-size:13px;color:var(--suave);margin-bottom:6px}
.refeicao.feita{opacity:.6}
.refeicao.feita .nome::after{content:" ✅"}
.ing{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--linha);font-size:14px}
.ing:last-child{border-bottom:0}
.ing .q{margin-left:auto;color:var(--suave);font-size:13px;white-space:nowrap}
ol.passos{padding-left:20px;margin:6px 0}
ol.passos li{margin-bottom:6px}
.porcao{display:flex;gap:8px;align-items:baseline;padding:5px 0}
.bolinha{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}

/* ---------- compras ---------- */
.compra{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:11px 12px;margin-bottom:6px}
.compra input[type=checkbox]{width:22px;height:22px;accent-color:var(--verde)}
.compra.ok .nome{text-decoration:line-through;color:var(--suave)}
.compra .nome{flex:1}
.x{border:0;background:none;color:var(--suave);font-size:18px;padding:2px 6px}

/* ---------- perfis ---------- */
.pessoa{display:flex;gap:12px;align-items:center}
.avatar{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px;flex:none}
.metricas{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.metricas div{background:var(--fundo);border-radius:10px;padding:8px;text-align:center}
.metricas b{display:block;font-size:15px}
.metricas small{font-size:11px;color:var(--suave)}
.codigo{font-size:26px;font-weight:800;letter-spacing:.15em;text-align:center;background:var(--verde-claro);color:var(--verde);border-radius:12px;padding:10px;margin:8px 0}

/* ---------- folha (modal de baixo) ---------- */
.fundo-folha{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;opacity:0;transition:opacity .2s}
.fundo-folha.aberta{opacity:1}
.folha{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--fundo);border-radius:20px 20px 0 0;max-height:92vh;overflow-y:auto;padding:8px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s;max-width:720px;margin:0 auto}
.folha.aberta{transform:none}
.folha .pegador{width:40px;height:5px;border-radius:3px;background:#d6d3d1;margin:4px auto 12px}
.folha h2{font-size:18px;margin-bottom:12px;padding-right:30px}
.folha .fechar{position:absolute;right:12px;top:12px;border:0;background:#e7e5e4;width:32px;height:32px;border-radius:50%;font-size:16px}
.opcao{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:0;border-radius:14px;padding:14px;margin-bottom:8px;box-shadow:var(--sombra)}
.opcao .ico{font-size:26px}
.opcao b{display:block}
.opcao small{color:var(--suave)}
.revisao{display:grid;grid-template-columns:24px 1fr 64px 62px;gap:6px;align-items:center;background:#fff;border-radius:12px;padding:8px;margin-bottom:6px}
.revisao input[type=checkbox]{width:20px;height:20px;accent-color:var(--verde)}
.revisao input,.revisao select{padding:7px 8px;font-size:14px}
.revisao .linha2{grid-column:2/5;display:flex;gap:6px}

/* ---------- carregando / aviso ---------- */
.carregando{position:fixed;inset:0;z-index:60;background:rgba(255,255,255,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px;white-space:pre-line}
.roda{width:42px;height:42px;border:4px solid var(--verde-claro);border-top-color:var(--verde);border-radius:50%;animation:gira 1s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:70;background:#1c1917;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}

/* ---------- login ---------- */
.tela-login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:420px;margin:0 auto}
.tela-login .logo{font-size:54px;text-align:center}
.tela-login h1{text-align:center;font-size:26px;color:var(--verde);margin:6px 0 4px}
.tela-login p.sub{text-align:center;color:var(--suave);margin:0 0 22px}
.separador{text-align:center;color:var(--suave);font-size:13px;margin:16px 0}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<section id="telaLogin" class="tela-login oculto">
  <div class="logo">🥫</div>
  <h1>Despensa Online</h1>
  <p class="sub">Sua despensa, seu cardápio da semana e sua lista de compras no mesmo lugar.</p>
  <div class="card">
    <label class="campo"><span>E-mail</span><input id="loginEmail" type="email" autocomplete="email"></label>
    <label class="campo"><span>Senha</span><input id="loginSenha" type="password" autocomplete="current-password"></label>
    <button class="btn bloco" onclick="entrar()">Entrar</button>
    <div class="separador">ainda não tem conta?</div>
    <button class="btn sec bloco" onclick="criarConta()">Criar conta com esse e-mail e senha</button>
  </div>
</section>

<!-- ================= CRIAR / ENTRAR NA CASA ================= -->
<section id="telaCasa" class="tela-login oculto">
  <div class="logo">🏡</div>
  <h1>Sua casa</h1>
  <p class="sub">A casa é o grupo que divide a mesma despensa. Crie uma nova ou entre na da sua família com o código de convite.</p>
  <div class="card">
    <label class="campo"><span>Seu nome</span><input id="casaMeuNome" type="text" placeholder="Como quer ser chamada(o)"></label>
  </div>
  <div class="card">
    <h3 style="margin-bottom:10px">Criar uma casa nova</h3>
    <label class="campo"><span>Nome da casa</span><input id="casaNome" type="text" placeholder="Ex.: Família Silva"></label>
    <button class="btn bloco" onclick="criarCasa()">Criar casa</button>
  </div>
  <div class="card">
    <h3 style="margin-bottom:10px">Já tenho um código</h3>
    <label class="campo"><span>Código de convite</span><input id="casaCodigo" type="text" placeholder="Ex.: A1B2C3" style="text-transform:uppercase"></label>
    <button class="btn sec bloco" onclick="entrarCasa()">Entrar na casa</button>
  </div>
  <button class="link" style="margin:8px auto" onclick="sair()">Sair</button>
</section>

<!-- ================= APP ================= -->
<section id="telaApp" class="oculto">
  <header class="topo">
    <h1 id="tituloTopo">Despensa</h1>
    <button class="btn-ico" onclick="recarregar(true)" title="Atualizar">⟳</button>
  </header>
  <main id="conteudo"></main>
  <button id="fab" class="fab oculto" onclick="menuAdicionar()">+</button>
  <nav class="abas">
    <button data-aba="inicio"   onclick="irPara('inicio')"><span>🏠</span>Início</button>
    <button data-aba="despensa" onclick="irPara('despensa')"><span>🥫</span>Despensa</button>
    <button data-aba="cardapio" onclick="irPara('cardapio')"><span>🍽️</span>Cardápio</button>
    <button data-aba="compras"  onclick="irPara('compras')"><span>🛒</span>Compras</button>
    <button data-aba="perfis"   onclick="irPara('perfis')"><span>👤</span>Perfis</button>
  </nav>
</section>

<input id="arquivoFoto" type="file" accept="image/*" capture="environment" class="oculto" onchange="fotoEscolhida(this)">
<input id="arquivoGaleria" type="file" accept="image/*" class="oculto" onchange="fotoEscolhida(this)">

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = (s) => String(s ?? "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ").trim();
const hojeISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const somaDias = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0,10); };
const diasAte = (iso) => Math.round((new Date(iso + "T12:00:00") - new Date(hojeISO() + "T12:00:00")) / 86400000);
const fmtData = (iso) => new Date(iso + "T12:00:00").toLocaleDateString("pt-BR", { weekday:"short", day:"2-digit", month:"2-digit" });
const fmtNum = (n) => Number(n ?? 0).toLocaleString("pt-BR", { maximumFractionDigits: 2 });
const ehFds = (iso) => [0,6].includes(new Date(iso + "T12:00:00").getDay());

function toast(msg, ms = 2800) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), ms);
}
function carregando(msg) {
  let el = $("carregando");
  if (!msg) { el?.remove(); return; }
  if (!el) { el = document.createElement("div"); el.id = "carregando"; el.className = "carregando"; document.body.appendChild(el); }
  el.innerHTML = `<div class="roda"></div><div>${esc(msg)}</div>`;
}

// ---------- folha (modal que sobe de baixo) ----------
function abrirFolha(html) {
  fecharFolha(true);
  const f = document.createElement("div"); f.className = "fundo-folha"; f.id = "fundoFolha"; f.onclick = () => fecharFolha();
  const s = document.createElement("div"); s.className = "folha"; s.id = "folha";
  s.innerHTML = `<div class="pegador"></div><button class="fechar" onclick="fecharFolha()">✕</button>${html}`;
  document.body.append(f, s);
  requestAnimationFrame(() => { f.classList.add("aberta"); s.classList.add("aberta"); });
}
function fecharFolha(imediato) {
  const f = $("fundoFolha"), s = $("folha");
  if (!f) return;
  if (imediato) { f.remove(); s.remove(); return; }
  f.classList.remove("aberta"); s.classList.remove("aberta");
  setTimeout(() => { f.remove(); s.remove(); }, 220);
}

// ---------- conversão de unidades ----------
function converter(q, de, para) {
  de = norm(de); para = norm(para);
  if (de === para) return q;
  const base = { g:["g",1], kg:["g",1000], ml:["ml",1], l:["ml",1000] };
  if (base[de] && base[para] && base[de][0] === base[para][0]) return q * base[de][1] / base[para][1];
  return null;
}

// =====================================================================
//  CÁLCULOS DE SAÚDE (estimativas — não substituem nutricionista)
// =====================================================================
function idade(p) {
  if (!p.nascimento) return null;
  const n = new Date(p.nascimento + "T12:00:00"), h = new Date();
  let a = h.getFullYear() - n.getFullYear();
  if (h < new Date(h.getFullYear(), n.getMonth(), n.getDate())) a--;
  return a;
}
function metaKcal(p) {
  if (p.meta_kcal) return { kcal: p.meta_kcal, manual: true };
  const a = idade(p);
  if (!p.peso_kg || !p.altura_cm || a == null || !p.sexo) return { kcal: 2000, incompleto: true };
  if (a < 18) return { kcal: 2000, crianca: true };
  // Fórmula de Mifflin-St Jeor × nível de atividade × objetivo
  const tmb = 10 * p.peso_kg + 6.25 * p.altura_cm - 5 * a + (p.sexo === "M" ? 5 : -161);
  const kcal = tmb * (ATIVIDADES[p.atividade]?.[1] ?? 1.375) * (OBJETIVOS[p.objetivo]?.[1] ?? 1);
  return { kcal: Math.round(kcal / 10) * 10 };
}
const imc = (p) => p.peso_kg && p.altura_cm ? p.peso_kg / ((p.altura_cm / 100) ** 2) : null;
function faixaImc(v) {
  if (v == null) return "";
  if (v < 18.5) return "abaixo do peso"; if (v < 25) return "peso adequado";
  if (v < 30) return "sobrepeso"; return "obesidade";
}

async function ia(acao, dados) {
  if (DEMO) { await new Promise(r => setTimeout(r, 900)); return iaDemo(acao, dados); }
  // na leitura de notas, a IA reaproveita os nomes que já existem na despensa (assim soma em vez de duplicar)
  if (acao.startsWith("ler_")) dados = { ...dados, nomes_existentes: S.itens.map(i => i.nome) };
  const { data, error } = await sb.functions.invoke("ia", { body: { acao, ...dados } });
  if (error) {
    let msg = error.message;
    try { const corpo = await error.context.json(); if (corpo?.erro) msg = corpo.erro; } catch {}
    throw new Error(msg);
  }
  if (data?.erro) throw new Error(data.erro);
  return data;
}

// leitura simples de lista digitada (usada no modo demonstração e se a IA falhar)
function lerListaSimples(texto) {
  return String(texto).split(/\n|;|,(?!\d)/).map(l => l.replace(/^\s*(?:[-•*▢☐]+|\d+[.)])\s+/, "").trim())
    .filter(Boolean).map(l => {
      const m = l.match(/^(\d+(?:[.,]\d+)?)\s*(kg|ml|latas?|lt|l|g|unid|un|pacotes?|pct|caixas?|cx|d[uú]zias?|dz)?(?=[\s.]|$)\.?\s*(?:de\s+)?(.+)$/i);
      let q = 1, u = "un", nome = l;
      if (m) { q = parseFloat(m[1].replace(",", ".")); nome = m[3]; u = norm(m[2] || "un");
        u = u.startsWith("pac") ? "pct" : u.startsWith("cai") ? "cx" : u.startsWith("lat") ? "lata" : u.startsWith("duz") ? "dz" : u === "unid" ? "un" : u === "l" || u === "lt" ? "L" : u; }
      nome = nome.charAt(0).toUpperCase() + nome.slice(1);
      const categoria = adivinharCategoria(nome);
      const local = ["Laticínios","Hortifruti"].includes(categoria) ? "geladeira" : categoria === "Congelados" || categoria === "Carnes e ovos" && !/ovo/i.test(nome) ? "freezer" : "despensa";
      return { nome, quantidade: q, unidade: u, categoria, local };
    });
}

// =====================================================================
//  RECEITAS EMBUTIDAS: o que dá pra fazer com o que tem
// =====================================================================
function acharItem(chave) {
  const alts = chave.split("|").map(norm);
  return S.itens.find(it => Number(it.quantidade) > 0 && alts.some(a => norm(it.nome).includes(a)));
}
function analisarReceita(r) {
  const tem = [], falta = [];
  for (const c of r.i) { const it = acharItem(c); (it ? tem : falta).push({ chave: c, item: it }); }
  const eqOk = r.e.every(e => (S.casa.equipamentos || []).includes(e));
  return { r, tem, falta, eqOk, pct: tem.length / r.i.length };
}
function sugestoesAgora(limite = 8) {
  return RECEITAS.map(analisarReceita).filter(x => x.eqOk && x.pct >= 0.5)
    .sort((a, b) => b.pct - a.pct || a.r.m - b.r.m).slice(0, limite);
}
const nomeChave = (c) => { const s = c.split("|")[0]; return s.charAt(0).toUpperCase() + s.slice(1); };

// converte receita embutida no mesmo formato que a IA devolve
function receitaParaRefeicao(r, tipo) {
  const pessoas = S.pessoas.length ? S.pessoas : [{ nome: "Porção", meta: 2000 }];
  const fatia = { "café da manhã":0.2, "almoço":0.35, "lanche":0.12, "jantar":0.3 }[tipo] ?? 0.3;
  return {
    tipo, nome: r.n, descricao: r.d, tempo_min: r.m, dificuldade: r.m > 45 ? "média" : "fácil",
    equipamentos: r.e, kcal_porcao: r.k, origem: "base", modo_preparo: PREPARO[r.n],
    porcoes: pessoas.map(p => {
      const alvo = (p.nome === "Porção" ? 2000 : metaKcal(p).kcal) * fatia;
      const mult = Math.max(0.5, Math.round(alvo / r.k * 2) / 2);
      return { pessoa: p.nome, quantidade: `${fmtNum(mult)} ${mult > 1 ? "porções" : "porção"}`, kcal: Math.round(mult * r.k) };
    }),
    ingredientes: r.i.map(c => { const it = acharItem(c);
      return { nome: it ? it.nome : nomeChave(c), quantidade: 0, unidade: "", item_id: it?.id ?? null }; }),
  };
}

// cardápio sem IA, montado a partir das receitas embutidas
function cardapioLocal(ctx) {
  const usadas = new Set(), dias = [], faltando = new Map();
  for (let d = 0; d < ctx.dias; d++) {
    const data = somaDias(ctx.inicio, d), tmax = ehFds(data) ? ctx.tempo_max_fds : ctx.tempo_max;
    const refeicoes = [];
    for (const tipo of ctx.refeicoes) {
      const op = RECEITAS.map(analisarReceita).filter(x => x.eqOk && x.r.t.includes(tipo) && x.r.m <= tmax)
        .sort((a, b) => (usadas.has(a.r.n) - usadas.has(b.r.n)) || b.pct - a.pct || Math.random() - .5);
      if (!op.length) continue;
      usadas.add(op[0].r.n);
      refeicoes.push(receitaParaRefeicao(op[0].r, tipo));
      op[0].falta.forEach(f => faltando.set(nomeChave(f.chave), { nome: nomeChave(f.chave), quantidade: 1, unidade: "un" }));
    }
    dias.push({ data, refeicoes });
  }
  return { resumo: "Cardápio montado com as receitas do próprio app, priorizando o que você já tem em casa.",
    dias, compras_sugeridas: [...faltando.values()], origem: "base" };
}

let jsQRCarregado;
function carregarJsQR() {
  return jsQRCarregado ??= new Promise((ok, erro) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"; s.onload = ok; s.onerror = erro;
    document.head.appendChild(s);
  });
}
async function abrirImagem(arquivo) {
  const url = URL.createObjectURL(arquivo), img = new Image();
  await new Promise((ok, erro) => { img.onload = ok; img.onerror = erro; img.src = url; });
  return img;
}
function desenhar(img, max) {
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas");
  c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c;
}
async function procurarQR(img) {
  try { await carregarJsQR(); } catch { return null; }
  for (const tam of [900, 1400, 2200]) {
    const c = desenhar(img, tam), dados = c.getContext("2d").getImageData(0, 0, c.width, c.height);
    const qr = window.jsQR(dados.data, c.width, c.height, { inversionAttempts: "attemptBoth" });
    if (qr?.data) return qr.data;
  }
  return null;
}
async function fotoEscolhida(input) {
  const arq = input.files[0]; input.value = "";
  if (!arq) return;
  fecharFolha();
  carregando("Procurando o QR Code da nota…");
  try {
    const img = await abrirImagem(arq);
    const qr = await procurarQR(img);
    if (qr && /^https?:\/\//i.test(qr)) {
      carregando("Nota fiscal encontrada! Buscando os itens na Sefaz…");
      try { const r = await ia("ler_nfce", { url: qr }); carregando(); return revisarItens(r.itens, r.observacao); }
      catch (e) { toast(e.message + " Vou ler pela foto.", 4000); }
    }
    carregando("Lendo os itens da foto…");
    const base64 = desenhar(img, 1600).toDataURL("image/jpeg", 0.85).split(",")[1];
    const r = await ia("ler_imagem", { imagem: base64, media_type: "image/jpeg" });
    revisarItens(r.itens, r.observacao);
  } catch (e) { toast("Não consegui ler: " + e.message, 5000); }
  finally { carregando(); }
}

// tela de conferência antes de adicionar
function revisarItens(itens, observacao, aoConcluir) {
  S.revisao = (itens || []).map(x => ({ ...x, ok: true }));
  S.aoConcluirRevisao = aoConcluir || null;
  if (!S.revisao.length) return toast("Não encontrei itens. Tente outra foto ou digite a lista.", 4000);
  abrirFolha(`<h2>Confira os itens (${S.revisao.length})</h2>
    ${observacao ? `<div class="aviso">${esc(observacao)}</div>` : ""}
    <p class="muted">Desmarque o que não quer adicionar e corrija o que precisar. Itens que já existem na despensa terão a quantidade somada.</p>
    <div id="listaRevisao">${S.revisao.map(linhaRevisao).join("")}</div>
    <button class="btn bloco" onclick="confirmarRevisao()" style="margin-top:6px">➕ Adicionar à despensa</button>`);
}
function linhaRevisao(x, i) {
  const existe = S.itens.find(it => norm(it.nome) === norm(x.nome));
  return `<div class="revisao">
    <input type="checkbox" ${x.ok ? "checked" : ""} onchange="S.revisao[${i}].ok=this.checked">
    <input type="text" value="${esc(x.nome)}" onchange="S.revisao[${i}].nome=this.value">
    <input type="number" step="any" inputmode="decimal" value="${x.quantidade}" onchange="S.revisao[${i}].quantidade=parseFloat(this.value)||0">
    <select onchange="S.revisao[${i}].unidade=this.value">${UNIDADES.map(u => `<option ${u === x.unidade ? "selected" : ""}>${u}</option>`).join("")}</select>
    <div class="linha2">
      <select onchange="S.revisao[${i}].local=this.value">${Object.entries(LOCAIS).map(([k, v]) => `<option value="${k}" ${k === x.local ? "selected" : ""}>${v}</option>`).join("")}</select>
      ${existe ? `<span class="chip azul" style="align-self:center">já tem ${fmtNum(existe.quantidade)} ${esc(existe.unidade)}</span>` : ""}
    </div>
  </div>`;
}
async function confirmarRevisao() {
  const sel = S.revisao.filter(x => x.ok && x.nome.trim());
  carregando("Guardando na despensa…");
  try {
    const novos = [];
    for (const x of sel) {
      const existe = S.itens.find(it => norm(it.nome) === norm(x.nome));
      const q = existe ? converter(x.quantidade, x.unidade, existe.unidade) : null;
      if (existe && q != null) {
        const nova = Math.round((Number(existe.quantidade) + q) * 100) / 100;
        Object.assign(existe, await db.atualizar("itens", existe.id, { quantidade: nova, atualizado_em: new Date().toISOString() }));
      } else {
        novos.push({ nome: x.nome.trim(), quantidade: x.quantidade, unidade: x.unidade, local: x.local || "despensa",
          categoria: x.categoria || adivinharCategoria(x.nome), atualizado_em: new Date().toISOString() });
      }
    }
    if (novos.length) S.itens.push(...await db.inserir("itens", novos));
    S.itens.sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"));
    // risca da lista de compras o que acabou de chegar
    const nomes = sel.map(x => norm(x.nome));
    const riscar = S.compras.filter(c => !c.comprado && nomes.some(n => n.includes(norm(c.nome)) || norm(c.nome).includes(n)));
    for (const c of riscar) { await db.atualizar("compras", c.id, { comprado: true }); c.comprado = true; }
    if (S.aoConcluirRevisao) await S.aoConcluirRevisao();
    fecharFolha(); render();
    toast(`${sel.length} itens adicionados ✓${riscar.length ? ` · ${riscar.length} riscados da lista de compras` : ""}`, 4000);
  } catch (e) { toast("Erro: " + e.message); }
  finally { carregando(); }
}

async function gerarCardapio(comIA) {
  const refeicoes = [...document.querySelectorAll("#cRefs .toggle.on")].map(b => b.textContent);
  if (!refeicoes.length) return toast("Escolha pelo menos uma refeição.");
  const pref = { refeicoes, dias: +$("cDias").value, tempo_max: +$("cTempo").value, tempo_max_fds: +$("cTempoFds").value };
  const contexto = {
    inicio: $("cInicio").value || hojeISO(), ...pref, pedido_extra: $("cExtra").value.trim(),
    equipamentos: S.casa.equipamentos || [],
    pessoas: S.pessoas.map(p => ({ nome: p.nome, kcal: metaKcal(p).kcal, gosta: p.gosta, nao_gosta: p.nao_gosta, restricoes: p.restricoes,
      descricao: [p.sexo === "F" ? "mulher" : p.sexo === "M" ? "homem" : "", idade(p) != null ? `${idade(p)} anos` : "", p.peso_kg ? `${p.peso_kg} kg` : "", OBJETIVOS[p.objetivo]?.[0]].filter(Boolean).join(", ") })),
    itens: S.itens.filter(i => Number(i.quantidade) > 0 && i.categoria !== "Limpeza")
      .map(i => ({ id: i.id, nome: i.nome, quantidade: i.quantidade, unidade: i.unidade, validade: i.validade })),
    favoritas: S.favoritas.map(f => f.nome), recentes: [...new Set(S.recentes)].slice(0, 30),
  };
  fecharFolha();
  carregando(comIA ? "A IA está montando seu cardápio…\nIsso leva cerca de 1 minuto." : "Montando cardápio…");
  try {
    let dados;
    if (comIA) {
      try { dados = await ia("cardapio", { contexto }); }
      catch (e) { toast("A IA não respondeu (" + e.message + "). Montei com as receitas do app.", 5000); dados = cardapioLocal(contexto); }
    } else dados = cardapioLocal(contexto);
    S.cardapio = await db.inserir("cardapios", { semana_inicio: contexto.inicio, dados });
    S.casa.preferencias = { ...S.casa.preferencias, ...pref };
    db.atualizar("casas", S.casa.id, { preferencias: S.casa.preferencias }).catch(() => {});
    S.subCardapio = "semana"; irPara("cardapio");
    toast("Cardápio pronto! 🍽️");
  } catch (e) { toast("Erro: " + e.message, 5000); }
  finally { carregando(); }
}

async function carregarPreparo() {
  const r = S.receitaAberta.ref;
  carregando("Escrevendo o passo a passo…");
  try {
    const x = await ia("receita", { receita: r });
    r.modo_preparo = x.modo_preparo; r.dica = x.dica;
    await S.receitaAberta.salvar(); mostrarReceita();
  } catch (e) { toast("Erro: " + e.message, 5000); }
  finally { carregando(); }
}
async function favoritar() {
  const r = S.receitaAberta.ref, f = S.favoritas.find(x => x.nome === r.nome);
  try {
    if (f) { await db.apagar("favoritas", f.id); S.favoritas = S.favoritas.filter(x => x !== f); toast("Removida das favoritas"); }
    else { const { feita, ...dados } = r; S.favoritas.push(await db.inserir("favoritas", { nome: r.nome, dados })); toast("⭐ Favoritada! A IA vai levar isso em conta."); }
    mostrarReceita();
  } catch (e) { toast("Erro: " + e.message); }
}
async function faltantesParaLista() {
  const r = S.receitaAberta.ref;
  const n = await addCompras(r.ingredientes.filter(x => !x.item_id).map(x => ({ nome: x.nome, quantidade: x.quantidade || null, unidade: x.unidade || null })), "cardapio");
  toast(n ? `${n} itens na lista de compras 🛒` : "Já estavam na lista.");
}
async function cozinhei() {
  const r = S.receitaAberta.ref, baixados = [], semQtd = [];
  carregando("Atualizando a despensa…");
  try {
    for (const x of r.ingredientes) {
      const it = x.item_id && S.itens.find(i => i.id === x.item_id);
      if (!it) continue;
      const q = x.quantidade ? converter(x.quantidade, x.unidade, it.unidade) : null;
      if (q == null) { semQtd.push(it.nome); continue; }
      const nova = Math.max(0, Math.round((Number(it.quantidade) - q) * 100) / 100);
      await db.atualizar("itens", it.id, { quantidade: nova, atualizado_em: new Date().toISOString() });
      it.quantidade = nova; baixados.push(it.nome);
    }
    r.feita = true; await S.receitaAberta.salvar();
    fecharFolha(); render();
    toast(`Bom apetite! 😋 ${baixados.length ? `Descontei: ${baixados.join(", ")}.` : ""}${semQtd.length ? ` Ajuste à mão: ${semQtd.join(", ")}.` : ""}`, 6000);
  } catch (e) { toast("Erro: " + e.message); }
  finally { carregando(); }
}

async function addCompras(lista, origem) {
  const abertos = S.compras.filter(c => !c.comprado).map(c => norm(c.nome));
  const novos = [];
  for (const x of lista) {
    if (!x.nome || abertos.includes(norm(x.nome)) || novos.some(n => norm(n.nome) === norm(x.nome))) continue;
    novos.push({ nome: x.nome, quantidade: x.quantidade ?? null, unidade: x.unidade ?? null, origem, comprado: false });
  }
  if (novos.length) S.compras.push(...await db.inserir("compras", novos));
  return novos.length;
}
async function addEstoqueBaixo() {
  try {
    const n = await addCompras(estoqueBaixo().map(it => ({ nome: it.nome, quantidade: Math.max(1, Number(it.minimo) * 2 - Number(it.quantidade)), unidade: it.unidade })), "estoque_baixo");
    toast(n ? `${n} itens adicionados à lista 🛒` : "Já estavam na lista."); render();
  } catch (e) { toast("Erro: " + e.message); }
}
async function addFaltantesCardapio() {
  try {
    const d = S.cardapio.dados;
    const lista = [...d.compras_sugeridas, ...d.dias.flatMap(x => x.refeicoes.flatMap(r => r.ingredientes.filter(i => !i.item_id)))];
    const n = await addCompras(lista.map(x => ({ nome: x.nome, quantidade: x.quantidade || null, unidade: x.unidade || null })), "cardapio");
    toast(n ? `${n} itens adicionados à lista 🛒` : "Já estavam na lista."); render();
  } catch (e) { toast("Erro: " + e.message); }
}

async function novaCompra() {
  const v = $("novaCompra").value.trim(); if (!v) return;

  try { await addCompras([{ nome: x.nome, quantidade: x.quantidade !== 1 || /^\d/.test(v) ? x.quantidade : null, unidade: /^\d/.test(v) ? x.unidade : null }], "manual"); render(); setTimeout(() => $("novaCompra")?.focus(), 50); }
  catch (e) { toast("Erro: " + e.message); }

async function marcarCompra(id, ok) {
  const c = S.compras.find(x => x.id === id); c.comprado = ok;
  try { await db.atualizar("compras", id, { comprado: ok }); render(); } catch (e) { toast("Erro: " + e.message); }

  try { await db.apagar("compras", id); S.compras = S.compras.filter(x => x.id !== id); render(); } catch (e) { toast("Erro: " + e.message); }

async function limparComprados() {
  const ids = S.compras.filter(c => c.comprado).map(c => c.id);
  try { await db.apagar("compras", ids); S.compras = S.compras.filter(c => !c.comprado); render(); } catch (e) { toast("Erro: " + e.message); }

function guardarComprados() {
  const feitos = S.compras.filter(c => c.comprado);
  revisarItens(feitos.map(c => {
    const cat = adivinharCategoria(c.nome);
    return { nome: c.nome, quantidade: Number(c.quantidade) || 1, unidade: UNIDADES.includes(c.unidade) ? c.unidade : "un", categoria: cat,
      local: ["Laticínios","Hortifruti"].includes(cat) ? "geladeira" : cat === "Congelados" ? "freezer" : "despensa" };
  }), "", async () => {
    await db.apagar("compras", feitos.map(c => c.id));
    S.compras = S.compras.filter(c => !feitos.includes(c));
  });
}
async function compartilharLista() {

    .map(c => `▢ ${c.nome}${c.quantidade ? ` (${fmtNum(c.quantidade)} ${c.unidade || ""})` : ""}`).join("\n");

    <div class="chips" id="pCores" style="margin:-4px 0 14px">${CORES.map(c => `<button class="toggle ${c === p.cor ? "on" : ""}" data-cor="${c}" style="width:34px;height:34px;padding:0;background:${c};border:3px solid ${c === p.cor ? "#1c1917" : "transparent"}" onclick="document.querySelectorAll('#pCores button').forEach(b=>{b.classList.remove('on');b.style.borderColor='transparent'});this.classList.add('on');this.style.borderColor='#1c1917'"></button>`).join("")}</div>
    <div class="linha-btns">
      ${id ? `<button class="btn perigo" onclick="apagarPessoa('${id}')">Excluir</button>` : ""}
      <button class="btn" onclick="salvarPessoa('${id || ""}')">Salvar</button>
    </div>`);
}
async function salvarPessoa(id) {
  const num = (v) => v === "" ? null : Number(v);
  const obj = { nome: $("pNome").value.trim(), sexo: $("pSexo").value || null, nascimento: $("pNasc").value || null,
    peso_kg: num($("pPeso").value), altura_cm: num($("pAlt").value), atividade: $("pAtiv").value, objetivo: $("pObj").value,
    meta_kcal: num($("pMeta").value), gosta: $("pGosta").value.trim(), nao_gosta: $("pNaoGosta").value.trim(),
    restricoes: $("pRestr").value.trim(), cor: document.querySelector("#pCores .on")?.dataset.cor || CORES[0] };
  if (!obj.nome) return toast("Digite o nome.");
  try {
    if (id) Object.assign(S.pessoas.find(x => x.id === id), await db.atualizar("pessoas", id, obj));
    else S.pessoas.push(await db.inserir("pessoas", obj));
    fecharFolha(); render(); toast("Perfil salvo ✓");
  } catch (e) { toast("Erro: " + e.message); }
}
async function apagarPessoa(id) {
  if (!confirm("Excluir este perfil?")) return;
  try { await db.apagar("pessoas", id); S.pessoas = S.pessoas.filter(x => x.id !== id); fecharFolha(); render(); }
  catch (e) { toast("Erro: " + e.message); }
}
async function alternarEquip(e) {
  const l = new Set(S.casa.equipamentos || []); l.has(e) ? l.delete(e) : l.add(e);
  S.casa.equipamentos = [...l]; render();
  try { await db.atualizar("casas", S.casa.id, { equipamentos: S.casa.equipamentos }); } catch (er) { toast("Erro: " + er.message); }
}
async function salvarPref(chave, valor) {
  S.casa.preferencias[chave] = valor; render();
  try { await db.atualizar("casas", S.casa.id, { preferencias: S.casa.preferencias }); } catch (e) { toast("Erro: " + e.message); }
}
function alternarRefeicao(r) {
  const l = S.casa.preferencias.refeicoes;
  salvarPref("refeicoes", l.includes(r) ? l.filter(x => x !== r) : REFEICOES.filter(x => l.includes(x) || x === r));
}
async function compartilharCodigo() {
  const txt = `Entre na nossa despensa no app Despensa Online: ${location.href.split("#")[0]}\nCódigo da casa: ${S.casa.codigo_convite}`;
  if (navigator.share) { try { await navigator.share({ text: txt }); } catch {} }
  else { await navigator.clipboard?.writeText(txt); toast("Convite copiado!"); }
}

// =====================================================================
//  INÍCIO DO APP
// =====================================================================
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.casa) recarregar(); });
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
iniciar();
</script>
